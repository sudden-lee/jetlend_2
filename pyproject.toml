[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".uv-cache*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest's `assert` is the standard way to state expectations in tests.
"tests/*" = ["S101"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
