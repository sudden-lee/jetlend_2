name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_DB: mailings
      POSTGRES_USER: mailings
      POSTGRES_PASSWORD: mailings-ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: mailings
          POSTGRES_USER: mailings
          POSTGRES_PASSWORD: mailings-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailings -d mailings"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate production settings
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-check-key-7d3ca54f81b620e94a6d37c58b1ef209
          DJANGO_ALLOWED_HOSTS: localhost
          DJANGO_HSTS_SECONDS: "31536000"
          DJANGO_HSTS_INCLUDE_SUBDOMAINS: "1"
          DJANGO_HSTS_PRELOAD: "1"
        run: python manage.py check --deploy
      - name: Validate
        run: |
          python -m pip check
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test mailings --noinput
          python -m ruff check .
          python -m ruff format --check .
